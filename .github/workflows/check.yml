name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/check-t3.mjs

      - run: node --test pstack/hooks/pstack-hook.test.mjs

      - working-directory: skills/poteto-mode/scripts
        run: npm ci && npm test
